<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>
/* 尽早应用主题，避免暗色用户看到一帧白屏 */
try {
  var __q = new URLSearchParams(location.search).get('theme');
  var __t = __q || localStorage.getItem('wb.theme');
  if (__t === 'dark') document.documentElement.classList.add('dark');
  else if (__t === 'light') document.documentElement.classList.add('light');
} catch (e) {}
</script>
<title>配置工作台 · Config Studio</title>
<link rel="stylesheet" href="/assets/app.css?vmvtar6s8" />
</head>
<body>

<!-- 图标：inline sprite，全部走 currentColor，深色/浅色自动跟随 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9.5h18M9.5 21V9.5"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <circle cx="11" cy="11" r="6.6"/><path d="m20.2 20.2-3.9-3.9"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z"/>
  </symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-cursor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4l6.5 15 2.2-6.3 6.3-2.2L4 4Z"/>
  </symbol>
  <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.8 2.2c-.9.5-1.4 1-1.4 2.1"/><path d="M12 17.2h.01"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v11.5"/><path d="m7.2 10.6 4.8 4.8 4.8-4.8"/><path d="M4.5 20.5h15"/>
  </symbol>
  <symbol id="i-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="8" r="2.5"/>
    <path d="M6.5 8v8M17.5 10.5c0 3-2.5 4-5 4.5"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2c.6 0 1.1.2 1.5.7l1 1.3h7.3A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5Z"/>
  </symbol>
</svg>

<header class="topbar flex items-center gap-5 shrink-0 h-[52px] px-5 bg-panel border-b border-line">
  <div class="brand flex items-center gap-2.5 min-w-0">
    <span class="logo"><svg aria-hidden="true"><use href="#i-grid"></use></svg></span>
    <div class="min-w-0">
      <h1 class="leading-tight tracking-tight">配置工作台</h1>
      <p class="sub leading-tight"><span id="stat-repo">配置仓库</span> · <span id="stat-tables">—</span> 张表 · <span id="stat-rows">—</span> 行</p>
    </div>
  </div>

  <div class="search-wrap relative flex-1 max-w-[520px] min-w-0">
    <svg class="s-ico" aria-hidden="true"><use href="#i-search"></use></svg>
    <input id="global-search" type="search" placeholder="全库搜索 RowName / 备注…" autocomplete="off" class="w-full" />
    <kbd>/</kbd>
  </div>

  <div class="legend flex items-center ml-auto">
    <span class="flex items-center"><span class="dot ref"></span>引用</span>
    <span class="flex items-center"><span class="dot enum"></span>枚举</span>
    <span class="flex items-center"><span class="dot num"></span>数值</span>
  </div>

  <button class="theme-btn shrink-0" id="upd-btn" title="检查更新" aria-label="检查更新">
    <svg aria-hidden="true"><use href="#i-download"></use></svg>
  </button>
  <button class="theme-btn shrink-0" id="help-btn" title="快捷键（?）" aria-label="快捷键">
    <svg aria-hidden="true"><use href="#i-help"></use></svg>
  </button>
  <button class="theme-btn shrink-0" id="theme-btn" title="切换浅色/暗色（右键恢复跟随系统）">亮</button>
</header>

<main class="layout">
  <aside class="sidebar flex flex-col min-h-0">
    <div class="side-head flex items-center justify-between">
      <span>配置表</span>
      <span class="side-count" id="table-count">—</span>
    </div>
    <div class="side-filter">
      <span class="sf-wrap">
        <input id="table-filter" type="search" placeholder="筛选表名…" autocomplete="off" class="w-full" />
        <button class="sf-x" type="button" data-sf-clear hidden title="清除（Esc）">×</button>
      </span>
    </div>
    <div id="table-list" class="table-list flex-1 overflow-y-auto min-h-0"></div>
  </aside>

  <section class="center flex flex-col min-h-0">
    <div class="center-head shrink-0">
      <div class="title-row">
        <h2 id="cur-title">—</h2>
        <div id="cur-badges" class="badges"></div>
      </div>
      <div class="meta-row" id="cur-meta"></div>
      <div class="toolbar">
        <span class="sf-wrap">
          <input id="row-search" type="search" placeholder="在本表内搜索…" autocomplete="off" />
          <button class="sf-x" type="button" data-sf-clear hidden title="清除（Esc）">×</button>
        </span>
        <label class="locate-wrap" title="勾上后，搜索会自动选中第一个匹配行；在搜索框里按 ↑ ↓ 逐个切换"><input type="checkbox" id="locate" checked /> 定位</label>
        <span class="spacer"></span>
        <button class="btn" id="btn-copy-row" title="以选中的行为模板新增一行（填个新行名即可）">⧉ 复制行</button>
        <button class="btn" id="btn-new-row" title="在表末尾新增一行（先填入队，预览后写盘）">＋ 新增行</button>
        <div class="pager flex items-center gap-1.5">
          <button id="prev" class="btn" title="上一页"><svg aria-hidden="true"><use href="#i-chev-l"></use></svg></button>
          <span id="page-info" class="tabular-nums">—</span>
          <button id="next" class="btn" title="下一页"><svg aria-hidden="true"><use href="#i-chev-r"></use></svg></button>
        </div>
      </div>
      <div class="pf" id="pf">
        <span class="pf-l">按属性筛选</span>
        <select id="pf-field" title="选择要筛选的字段"></select>
        <select id="pf-op" title="比较方式">
          <option value="=">= 等于</option>
          <option value="!=">≠ 不等于</option>
          <option value=">">&gt; 大于</option>
          <option value=">=">≥ 大于等于</option>
          <option value="<">&lt; 小于</option>
          <option value="<=">≤ 小于等于</option>
          <option value="contains">包含</option>
          <option value="empty">为空</option>
          <option value="notempty">非空</option>
        </select>
        <input id="pf-val" placeholder="值…" autocomplete="off" />
        <button class="btn" id="pf-add">添加</button>
        <div class="pf-chips" id="pf-chips"></div>
        <span class="pf-note" id="pf-note"></span>
        <button class="btn" id="pf-clear" hidden>清除筛选</button>
      </div>
    </div>

    <div class="grid-wrap flex-1 min-h-0 overflow-auto">
      <table id="grid" class="cfg-grid">
        <thead id="grid-head"></thead>
        <tbody id="grid-body"></tbody>
      </table>
      <div id="empty" class="empty" hidden>没有匹配的行</div>
    </div>
  </section>

  <aside class="detail overflow-y-auto min-h-0" id="detail">
    <div class="detail-empty">
      <div class="de-ico"><svg aria-hidden="true"><use href="#i-cursor"></use></svg></div>
      <p>从中间表格选一行</p>
      <p class="hint">这里会把这一行配置翻译成人话</p>
    </div>
  </aside>

  <div class="detail-grip" id="detail-grip" title="拖动调整右栏宽度 · 双击复位"></div>
</main>

<footer class="statusbar flex items-center gap-2.5 shrink-0 h-[26px] px-5 bg-panel border-t border-line">
  <span id="status">就绪</span>
  <span class="spacer flex-1"></span>
  <span class="hint">本地服务 · 数据直接在仓库文件上编辑</span>
</footer>

<script src="/assets/boot.js?vmvtar6s8"></script>
<script src="/assets/json-edit.js?vmvtar6s8"></script>
<script src="/assets/json-diff.js?vmvtar6s8"></script>
<script src="/assets/sem-from-schema.js?vmvtar6s8"></script>
<script src="/assets/data.js?vmvtar6s8"></script>
<script src="/assets/ref-picker.js?vmvtar6s8"></script>
<script src="/assets/layout.js?vmvtar6s8"></script>
<script src="/assets/update.js?vmvtar6s8"></script>
<script src="/assets/app.js?vmvtar6s8"></script>
<script src="/assets/struct-editor.js?vmvtar6s8"></script>
<script src="/assets/edit.js?vmvtar6s8"></script>
<script src="/assets/column-editor.js?vmvtar6s8"></script>
<script src="/assets/shortcuts.js?vmvtar6s8"></script>
<script src="/assets/git.js?vmvtar6s8"></script>
</body>
</html>
